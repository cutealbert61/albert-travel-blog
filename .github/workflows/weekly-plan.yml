name: Weekly Plan Email

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate week plan
        env:
          TRAVEL_BLOG_WRITE_TOKEN: ${{ secrets.TRAVEL_BLOG_WRITE_TOKEN }}
        run: python scripts/plan_week.py

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 亞伯特的生活旅遊日誌 - 下週文章規劃
          to: cutealbert61@gmail.com
          from: 亞伯特的生活旅遊日誌 <${{ secrets.GMAIL_ADDRESS }}>
          body: file://week_plan_email.txt
