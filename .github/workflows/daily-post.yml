name: Daily Travel Post
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/generate_post.py
      - name: Commit and push
        run: |
          git config user.name "albert-travel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/posts data/posts.json data/history.json
          git diff --cached --quiet || git commit -m "Daily travel post $(date +'%Y-%m-%d')"
          git push
