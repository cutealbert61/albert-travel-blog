<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台 | 亞伯特的生活旅遊日誌</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body{ background: var(--parchment); }
  .admin-wrap{ max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
  .token-box{ background:#fff; border:1px solid var(--paper-line); border-radius:6px; padding:18px 20px; margin-bottom:28px; }
  .token-box input{ width:100%; padding:10px; font-family: var(--font-mono); border:1px solid var(--paper-line); border-radius:4px; margin-top:8px; }
  [hidden]{ display:none !important; }
  .token-box p{ font-size:13px; color:#6b6155; margin: 4px 0; }
  .btn{ font-family: var(--font-mono); font-size:13px; padding:8px 14px; border-radius:4px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; }
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn.danger{ background:#fff; color:#b5432f; border-color:#b5432f; }
  .admin-card{ background:#fff; border:1px solid var(--paper-line); border-radius:6px; padding:16px 18px; margin-bottom:14px; display:flex; gap:14px; align-items:center; }
  .admin-card img{ width:100px; height:70px; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .admin-card .meta{ flex:1; }
  .admin-card .status{ font-family: var(--font-mono); font-size:11px; padding:2px 8px; border-radius:10px; }
  .status.published{ background:#e4efe3; color:#3f6b3d; }
  .status.unpublished{ background:#f3e0dc; color:#a5432f; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .admin-subline{ font-family:var(--font-mono); font-size:12px; color:#8a7f6f; }
  .classification-row{ display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-top:10px; }
  .classification-row label{ display:flex; flex-direction:column; gap:3px; font:11px var(--font-mono); }
  .classification-row select{ min-width:130px; padding:7px; border:1px solid var(--paper-line); background:#fff; }
  .security-note{ border-left:4px solid var(--marigold); background:#fff8e8; padding:10px 12px; margin-top:12px; font-size:12px; }
  @media(max-width:680px){ .admin-card{ align-items:flex-start; flex-direction:column; } .admin-card img{ width:100%; height:160px; } }
  #log{ font-family: var(--font-mono); font-size:12px; white-space:pre-wrap; color:#6b6155; margin-top:20px; }
</style>
</head>
<body>
<header class="site-header"><div class="wrap"><h1 class="site-title" style="font-size:20px;">管理後台<span class="en">JOURNAL ADMIN</span></h1></div></header>

<div class="admin-wrap">
  <div class="token-box" id="login-panel">
    <strong>管理員登入</strong>
    <p>登入連結會寄到已授權的管理員信箱，不需要輸入 GitHub Token。</p>
    <div class="security-note">文章資料、圖片與備份均由 Supabase 管理；GitHub Pages 只保留網站頁面。</div>
    <input type="email" id="email-input" autocomplete="email" value="cutealbert61@gmail.com">
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button class="btn" onclick="AdminApp.login()">寄送登入連結</button>
    </div>
  </div>
  <div class="token-box" id="session-panel" hidden>
    <strong>已登入管理後台</strong>
    <p>所有修改會直接儲存至 Supabase。</p>
    <button class="btn secondary" onclick="AdminApp.logout()">登出</button>
  </div>

  <div id="posts-list"></div>
  <div id="log"></div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
