<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亞伯特的生活旅遊日誌 Albert's Travel Journal</title>
<meta name="description" content="每天一篇,深度探索世界各地城市的旅遊日誌。中英雙語,圖文並茂。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">亞伯特的生活旅遊日誌<span class="en">ALBERT'S TRAVEL JOURNAL</span></h1>
    <div class="site-tagline">EST. 2026 · A NEW STAMP EVERY DAY</div>
  </div>
</header>

<main class="wrap ledger">
  <p class="ledger-intro">每天新的一頁蓋上一枚新的印章 —— 今天,我們去哪裡?</p>

  <div class="spotlight-row" id="spotlight-row"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">依地區瀏覽</div>
      <button class="filter-btn active" data-scope="all" data-value="">
        全部文章 <span class="count" id="count-all">0</span>
      </button>
      <div id="country-tree"></div>
    </aside>

    <div class="ledger-main">
      <div id="entries"></div>
      <p id="empty-state" style="display:none; font-family: var(--font-mono); color:#8a7f6f;">這個分類還沒有文章。</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">亞伯特的生活旅遊日誌 · 內容由 AI 協助生成,照片來源 Unsplash · <a href="admin/index.html">管理後台</a></div>
</footer>

<script>
let ALL_POSTS = [];
let SITE_THEME = null;

const COUNTRY_ZH_MAP = {
  "JPN": "日本", "THA": "泰國", "KOR": "韓國", "IDN": "印尼",
  "VNM": "越南", "TUR": "土耳其", "FRA": "法國", "PRT": "葡萄牙",
  "CZE": "捷克", "GRC": "希臘", "ISL": "冰島", "ESP": "西班牙",
  "ZAF": "南非", "MAR": "摩洛哥", "TZA": "坦尚尼亞", "USA": "美國",
  "MEX": "墨西哥", "PER": "秘魯", "ARG": "阿根廷", "CAN": "加拿大",
  "NZL": "紐西蘭", "AUS": "澳洲", "FJI": "斐濟"
};

const CITY_ZH_MAP = {
  "Kyoto": "京都", "Chiang Mai": "清邁", "Seoul": "首爾", "Ubud, Bali": "峇里島烏布",
  "Hanoi": "河內", "Istanbul": "伊斯坦堡", "Paris": "巴黎", "Lisbon": "里斯本",
  "Prague": "布拉格", "Santorini": "聖托里尼", "Reykjavik": "雷克雅維克", "Barcelona": "巴塞隆納",
  "Cape Town": "開普敦", "Marrakech": "馬拉喀什", "Zanzibar": "尚吉巴", "New York City": "紐約",
  "Mexico City": "墨西哥城", "Cusco": "庫斯科", "Buenos Aires": "布宜諾斯艾利斯", "Vancouver": "溫哥華",
  "Queenstown": "皇后鎮", "Sydney": "雪梨", "Suva": "斐濟蘇瓦"
};

function countryLabel(p) {
  return p.country_zh || COUNTRY_ZH_MAP[p.country_code] || p.country_code || "其他";
}

function cityLabel(p) {
  return p.city_zh || CITY_ZH_MAP[p.city_en] || p.city_en;
}

function buildSidebar(posts) {
  const tree = {};
  posts.forEach(function(p) {
    const country = countryLabel(p);
    if (!tree[country]) tree[country] = {};
    const city = cityLabel(p);
    if (!tree[country][city]) tree[country][city] = { cityEn: p.city_en, count: 0 };
    tree[country][city].count++;
  });

  const container = document.getElementById("country-tree");
  const countries = Object.keys(tree).sort();
  container.innerHTML = countries.map(function(country) {
    const cities = tree[country];
    const cityCount = Object.values(cities).reduce(function(a, c) { return a + c.count; }, 0);
    const citiesHtml = Object.keys(cities).sort().map(function(city) {
      const c = cities[city];
      return '<button class="filter-btn city-btn" data-scope="city" data-value="' + c.cityEn + '">' +
        city + ' <span class="count">' + c.count + '</span></button>';
    }).join("");
    return '<div class="country-group">' +
      '<button class="filter-btn country-btn" data-scope="country" data-value="' + country + '">' +
      country + ' <span class="count">' + cityCount + '</span></button>' +
      '<div class="city-list">' + citiesHtml + '</div></div>';
  }).join("");

  document.getElementById("count-all").textContent = posts.length;
}

function renderSpotlight() {
  const row = document.getElementById("spotlight-row");
  if (!SITE_THEME) { row.style.display = "none"; return; }

  let html = "";
  const w = SITE_THEME.weekly_spotlight;
  if (w && w.city_en) {
    html += '<button class="filter-btn spotlight-card weekly" data-scope="city" data-value="' + w.city_en + '">' +
      '<div class="spotlight-label">' + (w.headline_zh || "本週焦點城市") + '</div>' +
      '<h3>' + (w.country_zh || "") + ' ' + (w.city_zh || "") + '</h3>' +
      '<p>' + (w.note_zh || "") + '</p></button>';
  }
  const m = SITE_THEME.monthly_theme;
  if (m && m.countries_zh && m.countries_zh.length) {
    html += '<button class="filter-btn spotlight-card monthly" data-scope="theme" data-value="' + m.countries_zh.join(",") + '">' +
      '<div class="spotlight-label">' + (m.headline_zh || "本月主題") + '</div>' +
      '<h3>' + m.countries_zh.join(" · ") + '</h3>' +
      '<p>' + (m.note_zh || "") + '</p></button>';
  }
  row.innerHTML = html;
  if (!html) row.style.display = "none";
}

function applyFilter(scope, value) {
  document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
  let selector = '[data-scope="all"]';
  if (scope !== "all") {
    selector = '[data-scope="' + scope + '"][data-value="' + CSS.escape(value) + '"]';
  }
  document.querySelectorAll(selector).forEach(function(b) { b.classList.add("active"); });

  let filtered = ALL_POSTS;
  if (scope === "country") {
    filtered = ALL_POSTS.filter(function(p) { return countryLabel(p) === value; });
  } else if (scope === "city") {
    filtered = ALL_POSTS.filter(function(p) { return p.city_en === value; });
  } else if (scope === "theme") {
    const list = value.split(",");
    filtered = ALL_POSTS.filter(function(p) { return list.indexOf(countryLabel(p)) !== -1; });
  }
  renderEntries(filtered);
}

function renderEntries(posts) {
  const container = document.getElementById("entries");
  const emptyState = document.getElementById("empty-state");
  const sorted = posts.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

  if (sorted.length === 0) {
    container.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  container.innerHTML = sorted.map(function(p) {
    return '<a class="entry-card" href="posts/' + p.slug + '.html">' +
      '<img class="entry-photo" src="' + p.cover_image + '" alt="' + p.city_en + '" loading="lazy">' +
      '<div class="entry-body">' +
      '<div class="stamp"><span class="code">' + p.country_code + '</span><span class="date">' + p.date + '</span></div>' +
      '<div class="entry-eyebrow">' + countryLabel(p) + ' · ' + cityLabel(p) + '</div>' +
      '<h2 class="entry-title">' + p.title_zh + '<span class="en">' + p.title_en + '</span></h2>' +
      '<p class="entry-excerpt">' + p.excerpt_zh + '</p>' +
      '</div></a>';
  }).join("");
}

async function loadTheme() {
  try {
    const res = await fetch('data/site_theme.json?_=' + Date.now());
    SITE_THEME = await res.json();
  } catch (e) {
    SITE_THEME = null;
  }
  renderSpotlight();
}

async function loadEntries() {
  const res = await fetch('data/posts.json?_=' + Date.now());
  const posts = await res.json();
  ALL_POSTS = posts.filter(function(p) { return p.status === 'published'; });

  buildSidebar(ALL_POSTS);
  renderEntries(ALL_POSTS);
  await loadTheme();

  document.body.addEventListener("click", function(e) {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    applyFilter(btn.dataset.scope, btn.dataset.value);
  });
}
loadEntries();
</script>

</body>
</html>
