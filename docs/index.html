<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亞伯特的生活旅遊日誌 Albert's Travel Journal</title>
<meta name="description" content="亞伯特的親身旅遊、預定旅程、旅遊資料整理與靈感收藏。中英雙語，依地圖、時間軸與主題探索世界。">
<link rel="canonical" href="https://cutealbert61.github.io/albert-travel-blog/">
<meta property="og:type" content="website">
<meta property="og:title" content="亞伯特的生活旅遊日誌 Albert's Travel Journal">
<meta property="og:description" content="從旅遊護照、世界地圖與時間軸，探索亞伯特收藏的世界旅程。">
<meta property="og:url" content="https://cutealbert61.github.io/albert-travel-blog/">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="亞伯特的生活旅遊日誌 RSS" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">亞伯特的生活旅遊日誌<span class="en">ALBERT'S TRAVEL JOURNAL</span></h1>
    <div class="site-tagline">EST. 2026 · A NEW STAMP EVERY DAY</div>
  </div>
</header>
<main class="wrap ledger">
  <p class="ledger-intro">每天新的一頁蓋上一枚新的印章 —— 今天，我們去哪裡？</p>
  <section class="travel-overview" aria-labelledby="map-title">
    <div class="section-head">
      <div><p class="section-kicker">TRAVEL PASSPORT</p><h2 id="map-title">世界足跡</h2></div>
      <div class="map-legend" aria-label="地圖圖例">
        <span><i class="map-dot visited"></i>已造訪</span><span><i class="map-dot planned"></i>計畫前往</span><span><i class="map-dot inspiration"></i>靈感收藏</span>
      </div>
    </div>
    <div class="passport-stats" id="passport-stats"></div>
    <div class="world-map" id="travel-map" aria-label="互動旅遊世界地圖">
      <svg class="world-map-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="ocean-wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ca6b4"/><stop offset="1" stop-color="#617d8d"/></linearGradient>
          <linearGradient id="land-wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7dfbf"/><stop offset="1" stop-color="#c9c39f"/></linearGradient>
          <filter id="land-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#263f4a" flood-opacity=".26"/></filter>
        </defs>
        <rect width="1000" height="500" fill="url(#ocean-wash)"/>
        <g class="map-graticule">
          <path d="M0 83H1000M0 167H1000M0 250H1000M0 333H1000M0 417H1000"/><path d="M125 0V500M250 0V500M375 0V500M500 0V500M625 0V500M750 0V500M875 0V500"/>
          <ellipse cx="500" cy="250" rx="490" ry="165"/><ellipse cx="500" cy="250" rx="490" ry="80"/>
        </g>
        <g class="map-landmass" filter="url(#land-shadow)">
          <path d="M45 104L72 82l42 1 27-21 49 9 27 22 45 5 30 23-7 24-31 13-18 31-21 4-18 26 20 24-13 19-28-9-21-29-26-7-15-31-34-8-22-27-16-24z"/>
          <path d="M117 73l15-29 42-22 54 8 26 25-22 25-48-9-29 19z"/>
          <path d="M185 232l32 4 28 18 39 4 19 19-15 17-31-15-25-24-37-8z"/>
          <path d="M286 260l35-20 40 9 25 27-5 37-20 29-10 42-25 67-25-39-4-48-19-40 9-34z"/>
          <path d="M430 133l25-20 23 7 17-17 31 8 25-13 29 17-7 20-29 8-16 23-27-3-21 19-24-11-26-15z"/>
          <path d="M467 195l40-25 55 8 40 39-5 49-28 33-15 71-31 55-32-32-10-63-27-43-7-55z"/>
          <path d="M532 118l38-33 60 8 35-19 61 12 33-17 72 16 52 28 64 2 22 26-31 31-50 2-19 31-42 3-25 29-52 0-26 25-29-19-32 12-17-25-29-17-15-39-36-22-11-31z"/>
          <path d="M636 218l38 8 28 27-10 44-27 33-18-37-26-34z"/><path d="M730 255l35 4 27 25-16 22-39-15-20-20z"/>
          <path d="M783 333l48-26 69 8 41 37-14 48-44 29-69-14-35-37z"/><path d="M946 365l15-17 11 28-12 35-13-15z"/>
          <path d="M5 472l83-9 77 8 79-10 85 9 85-8 82 10 83-9 87 8 75-11 87 10 78-7 69 10v27H5z"/>
          <ellipse cx="445" cy="72" rx="12" ry="6"/><circle cx="858" cy="181" r="6"/><circle cx="864" cy="198" r="5"/><circle cx="870" cy="216" r="4"/><circle cx="955" cy="301" r="5"/><circle cx="975" cy="287" r="4"/><circle cx="988" cy="314" r="3"/>
        </g>
        <g class="map-borders"><path d="M60 140l63 8 58-24 56 21M112 177l52-2 33 44M205 231l28 24M312 252l10 51 39 39M456 145l49 18 68-28M491 201l61 23 45-7M481 287l77-4 11 16M551 177l77-25 63 42 77-35 80 13M641 219l44-62M700 237l59-79M783 333l45 48 99 19"/></g>
        <g class="map-continent-labels"><text x="145" y="137">NORTH AMERICA</text><text x="306" y="338">SOUTH AMERICA</text><text x="470" y="151">EUROPE</text><text x="506" y="279">AFRICA</text><text x="706" y="143">ASIA</text><text x="832" y="375">OCEANIA</text></g>
      </svg>
      <div class="map-compass" aria-hidden="true"><b>N</b><span></span></div><div class="map-hint" aria-hidden="true">點選標記篩選文章</div>
    </div>
  </section>
  <section class="timeline-panel" aria-labelledby="timeline-title">
    <div class="section-head compact"><div><p class="section-kicker">JOURNEY TIMELINE</p><h2 id="timeline-title">旅程時間軸</h2></div></div>
    <div class="travel-timeline" id="travel-timeline"></div>
  </section>
  <section class="filter-panel" aria-label="文章搜尋與篩選">
    <label class="search-field"><span>搜尋文章</span><input id="search-input" type="search" placeholder="輸入國家、城市、標題或關鍵字"></label>
    <label><span>文章性質</span><select id="type-filter"><option value="">全部</option></select></label>
    <label><span>旅程狀態</span><select id="status-filter"><option value="">全部</option></select></label>
    <label><span>年份</span><select id="year-filter"><option value="">全部</option></select></label>
    <label><span>排序</span><select id="sort-filter"><option value="newest">最新發布</option><option value="oldest">最早發布</option><option value="title">標題排序</option></select></label>
    <button class="clear-filters" id="clear-filters" type="button">清除篩選</button>
  </section>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">依地區瀏覽</div>
      <button class="filter-btn active" data-scope="all" data-value="">全部文章 <span class="count" id="count-all">0</span></button>
      <div id="country-tree"></div>
    </aside>
    <div class="ledger-main">
      <div class="results-summary" id="results-summary" aria-live="polite"></div>
      <div id="entries"></div>
      <p id="empty-state" class="empty-state" hidden>找不到符合條件的文章，請調整搜尋或篩選條件。</p>
    </div>
  </div>
</main>
<footer class="site-footer"><div class="wrap">亞伯特的生活旅遊日誌 · 部分內容使用數位工具協助資料整理、翻譯及編輯，發布前均經人工檢視 · 照片來源 Unsplash</div></footer>
<script>
'use strict';
let ALL_POSTS = [];
const FILTERS = { scope: 'all', value: '', query: '', type: '', travelStatus: '', year: '', sort: 'newest' };
const CONTENT_TYPES = {
  personal: { label: '亞伯特親身旅遊', icon: '✓' }, planned: { label: '預定旅程', icon: '◷' },
  research: { label: '旅遊資料整理', icon: '▤' }, inspiration: { label: '靈感收藏', icon: '✦' }
};
const TRAVEL_STATUSES = {
  visited: { label: '已造訪', icon: '●' }, planned: { label: '計畫前往', icon: '◐' }, inspiration: { label: '靈感收藏', icon: '○' }
};
const COUNTRY_ZH_MAP = {
  JPN:'日本', THA:'泰國', KOR:'韓國', IDN:'印尼', VNM:'越南', TUR:'土耳其', FRA:'法國', PRT:'葡萄牙', CZE:'捷克', GRC:'希臘', ISL:'冰島', ESP:'西班牙',
  ZAF:'南非', MAR:'摩洛哥', TZA:'坦尚尼亞', USA:'美國', MEX:'墨西哥', PER:'秘魯', ARG:'阿根廷', CAN:'加拿大', NZL:'紐西蘭', AUS:'澳洲', FJI:'斐濟'
};
const CITY_ZH_MAP = {
  Kyoto:'京都', 'Chiang Mai':'清邁', Seoul:'首爾', 'Ubud, Bali':'峇里島烏布', Hanoi:'河內', Istanbul:'伊斯坦堡', Paris:'巴黎', Lisbon:'里斯本', Prague:'布拉格',
  Santorini:'聖托里尼', Reykjavik:'雷克雅維克', Barcelona:'巴塞隆納', 'Cape Town':'開普敦', Marrakech:'馬拉喀什', Zanzibar:'尚吉巴', 'New York City':'紐約',
  'Mexico City':'墨西哥城', Cusco:'庫斯科', 'Buenos Aires':'布宜諾斯艾利斯', Vancouver:'溫哥華', Queenstown:'皇后鎮', Sydney:'雪梨', Suva:'斐濟蘇瓦'
};
const MAP_POINTS = {
  CAN:[20.5,18.5], USA:[22.5,28], MEX:[21.5,37], PER:[29,55], ARG:[32,69], ISL:[44.5,14], PRT:[47.5,28], ESP:[49,27.5], FRA:[50.5,24], CZE:[54,23], GRC:[56,28],
  MAR:[48,32], ZAF:[56.5,66], TZA:[60,53], TUR:[60,28], JPN:[87,30], KOR:[85,30], THA:[78,42], VNM:[80,41], IDN:[82,51], AUS:[87,64], NZL:[97,73], FJI:[98,59]
};
function escapeHTML(value) {
  return String(value == null ? '' : value).replace(/[&<>'"]/g, function(ch) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]; });
}
function countryLabel(p) { return p.country_zh || COUNTRY_ZH_MAP[p.country_code] || p.country_code || '其他'; }
function cityLabel(p) { return p.city_zh || CITY_ZH_MAP[p.city_en] || p.city_en || '未標示城市'; }
function normalizePost(p) {
  return Object.assign({}, p, { content_type: CONTENT_TYPES[p.content_type] ? p.content_type : 'research', travel_status: TRAVEL_STATUSES[p.travel_status] ? p.travel_status : 'inspiration' });
}
function populateSelect(id, values) {
  const select = document.getElementById(id);
  Object.keys(values).forEach(function(key) { const option = document.createElement('option'); option.value = key; option.textContent = values[key].label; select.appendChild(option); });
}
function buildSidebar(posts) {
  const tree = {};
  posts.forEach(function(p) {
    const country = countryLabel(p); const city = cityLabel(p);
    if (!tree[country]) tree[country] = {};
    if (!tree[country][city]) tree[country][city] = { cityEn: p.city_en, count: 0 };
    tree[country][city].count += 1;
  });
  document.getElementById('country-tree').innerHTML = Object.keys(tree).sort().map(function(country) {
    const cities = tree[country]; const cityCount = Object.values(cities).reduce(function(total, item) { return total + item.count; }, 0);
    const cityHTML = Object.keys(cities).sort().map(function(city) { const item = cities[city]; return '<button class="filter-btn city-btn" data-scope="city" data-value="' + escapeHTML(item.cityEn) + '">' + escapeHTML(city) + ' <span class="count">' + item.count + '</span></button>'; }).join('');
    return '<div class="country-group"><button class="filter-btn country-btn" data-scope="country" data-value="' + escapeHTML(country) + '">' + escapeHTML(country) + ' <span class="count">' + cityCount + '</span></button><div class="city-list">' + cityHTML + '</div></div>';
  }).join('');
  document.getElementById('count-all').textContent = posts.length;
}
function buildOverview(posts) {
  const countries = new Set(posts.map(function(p) { return p.country_code; }));
  const cities = new Set(posts.map(function(p) { return p.city_en; }));
  const journeys = new Set(posts.map(function(p) { return p.date + '|' + p.city_en; }));
  document.getElementById('passport-stats').innerHTML = [['文章', posts.length], ['國家', countries.size], ['城市', cities.size], ['旅程收藏', journeys.size]].map(function(item) { return '<div class="stat-card"><strong>' + item[1] + '</strong><span>' + item[0] + '</span></div>'; }).join('');
  const grouped = {};
  posts.forEach(function(p) { if (!MAP_POINTS[p.country_code]) return; if (!grouped[p.country_code]) grouped[p.country_code] = []; grouped[p.country_code].push(p); });
  const map = document.getElementById('travel-map');
  Object.keys(grouped).forEach(function(code) {
    const items = grouped[code]; const point = MAP_POINTS[code];
    const preferred = items.find(function(p) { return p.travel_status === 'visited'; }) || items.find(function(p) { return p.travel_status === 'planned'; }) || items[0];
    const button = document.createElement('button'); button.type = 'button'; button.className = 'map-pin ' + preferred.travel_status;
    button.style.left = point[0] + '%'; button.style.top = point[1] + '%'; button.dataset.scope = 'country'; button.dataset.value = countryLabel(preferred);
    const label = countryLabel(preferred); button.setAttribute('aria-label', label + '，' + items.length + ' 篇文章'); button.title = label + ' · ' + items.length + ' 篇文章';
    button.innerHTML = '<span class="pin-marker"><b>' + escapeHTML(code) + '</b><small>' + items.length + '</small></span><span class="pin-name">' + escapeHTML(label) + '</span>'; map.appendChild(button);
  });
}
function buildTimeline(posts) {
  const grouped = {};
  posts.forEach(function(p) { const year = String(p.date || '').slice(0, 4) || '未標日期'; if (!grouped[year]) grouped[year] = []; grouped[year].push(p); });
  document.getElementById('travel-timeline').innerHTML = Object.keys(grouped).sort().reverse().map(function(year) {
    const cities = Array.from(new Set(grouped[year].map(function(p) { return cityLabel(p); })));
    return '<button type="button" class="timeline-year" data-year="' + escapeHTML(year) + '"><strong>' + escapeHTML(year) + '</strong><span>' + escapeHTML(cities.join(' · ')) + '</span><small>' + grouped[year].length + ' 篇</small></button>';
  }).join('');
}
function filterPosts() {
  const query = FILTERS.query.trim().toLocaleLowerCase('zh-Hant');
  const posts = ALL_POSTS.filter(function(p) {
    if (FILTERS.scope === 'country' && countryLabel(p) !== FILTERS.value) return false;
    if (FILTERS.scope === 'city' && p.city_en !== FILTERS.value) return false;
    if (FILTERS.type && p.content_type !== FILTERS.type) return false;
    if (FILTERS.travelStatus && p.travel_status !== FILTERS.travelStatus) return false;
    if (FILTERS.year && String(p.date).slice(0, 4) !== FILTERS.year) return false;
    if (query) {
      const haystack = [p.title_zh, p.title_en, p.excerpt_zh, p.excerpt_en, countryLabel(p), cityLabel(p), p.angle_en].concat(p.tags || []).join(' ').toLocaleLowerCase('zh-Hant');
      if (!haystack.includes(query)) return false;
    }
    return true;
  });
  posts.sort(function(a, b) {
    if (FILTERS.sort === 'oldest') return new Date(a.date) - new Date(b.date);
    if (FILTERS.sort === 'title') return String(a.title_zh).localeCompare(String(b.title_zh), 'zh-Hant');
    return new Date(b.date) - new Date(a.date);
  });
  return posts;
}
function updateActiveScope() {
  document.querySelectorAll('.filter-btn').forEach(function(button) { button.classList.remove('active'); });
  let selector = '[data-scope="all"]';
  if (FILTERS.scope !== 'all') selector = '[data-scope="' + FILTERS.scope + '"][data-value="' + CSS.escape(FILTERS.value) + '"]';
  const active = document.querySelector(selector); if (active) active.classList.add('active');
}
function renderEntries() {
  const posts = filterPosts(); const container = document.getElementById('entries'); const empty = document.getElementById('empty-state');
  document.getElementById('results-summary').textContent = '顯示 ' + posts.length + ' / ' + ALL_POSTS.length + ' 篇文章'; empty.hidden = posts.length !== 0;
  if (!posts.length) { container.innerHTML = ''; return; }
  container.innerHTML = posts.map(function(p) {
    const type = CONTENT_TYPES[p.content_type]; const status = TRAVEL_STATUSES[p.travel_status];
    return '<a class="entry-card" href="posts/' + encodeURIComponent(p.slug) + '.html"><img class="entry-photo" src="' + escapeHTML(p.cover_image) + '" alt="' + escapeHTML(cityLabel(p)) + '" loading="lazy"><div class="entry-body">' +
      '<div class="stamp"><span class="code">' + escapeHTML(p.country_code) + '</span><span class="date">' + escapeHTML(p.date) + '</span></div>' +
      '<div class="entry-badges"><span class="content-badge ' + escapeHTML(p.content_type) + '">' + type.icon + ' ' + escapeHTML(type.label) + '</span><span class="travel-badge ' + escapeHTML(p.travel_status) + '">' + status.icon + ' ' + escapeHTML(status.label) + '</span></div>' +
      '<div class="entry-eyebrow">' + escapeHTML(countryLabel(p)) + ' · ' + escapeHTML(cityLabel(p)) + '</div><h2 class="entry-title">' + escapeHTML(p.title_zh) + '<span class="en">' + escapeHTML(p.title_en) + '</span></h2><p class="entry-excerpt">' + escapeHTML(p.excerpt_zh) + '</p></div></a>';
  }).join('');
}
function refresh() { updateActiveScope(); renderEntries(); }
function clearFilters() {
  Object.assign(FILTERS, { scope:'all', value:'', query:'', type:'', travelStatus:'', year:'', sort:'newest' });
  ['search-input','type-filter','status-filter','year-filter'].forEach(function(id) { document.getElementById(id).value = ''; }); document.getElementById('sort-filter').value = 'newest'; refresh();
}
async function loadEntries() {
  try {
    const response = await fetch('data/posts.json?_=' + Date.now()); if (!response.ok) throw new Error('HTTP ' + response.status);
    const posts = await response.json(); ALL_POSTS = posts.filter(function(p) { return p.status === 'published'; }).map(normalizePost);
    buildSidebar(ALL_POSTS); buildOverview(ALL_POSTS); buildTimeline(ALL_POSTS); populateSelect('type-filter', CONTENT_TYPES); populateSelect('status-filter', TRAVEL_STATUSES);
    Array.from(new Set(ALL_POSTS.map(function(p) { return String(p.date).slice(0, 4); }))).sort().reverse().forEach(function(year) { const option = document.createElement('option'); option.value = year; option.textContent = year; document.getElementById('year-filter').appendChild(option); });
    refresh();
  } catch (error) {
    document.getElementById('empty-state').hidden = false; document.getElementById('empty-state').textContent = '文章載入失敗，請稍後重新整理。'; console.error(error);
  }
}
document.getElementById('sidebar').addEventListener('click', function(event) { const button = event.target.closest('.filter-btn'); if (!button) return; FILTERS.scope = button.dataset.scope; FILTERS.value = button.dataset.value; refresh(); });
document.getElementById('travel-map').addEventListener('click', function(event) { const button = event.target.closest('.map-pin'); if (!button) return; FILTERS.scope = button.dataset.scope; FILTERS.value = button.dataset.value; refresh(); document.getElementById('entries').scrollIntoView({ behavior:'smooth', block:'start' }); });
document.getElementById('travel-timeline').addEventListener('click', function(event) { const button = event.target.closest('.timeline-year'); if (!button) return; FILTERS.year = button.dataset.year; document.getElementById('year-filter').value = FILTERS.year; refresh(); });
document.getElementById('search-input').addEventListener('input', function(event) { FILTERS.query = event.target.value; refresh(); });
document.getElementById('type-filter').addEventListener('change', function(event) { FILTERS.type = event.target.value; refresh(); });
document.getElementById('status-filter').addEventListener('change', function(event) { FILTERS.travelStatus = event.target.value; refresh(); });
document.getElementById('year-filter').addEventListener('change', function(event) { FILTERS.year = event.target.value; refresh(); });
document.getElementById('sort-filter').addEventListener('change', function(event) { FILTERS.sort = event.target.value; refresh(); });
document.getElementById('clear-filters').addEventListener('click', clearFilters);
loadEntries();
</script>
</body>
</html>
